name: Production Deployment

env:
  VERCEL_ORG_ID: ${{ secrets.ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.PROJECT_ID }}
  LEFTHOOK: 0

on:
  push:
    branches:
      - main

jobs:
  Workflow:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      #  config_actions:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # add pnpm
      - name: Config pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          run_install: false

      #  setup_node:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      #  install_dependencies:
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      #  typecheck:
      - name: Run Typescript Check
        run: pnpm typecheck

      #  lint:
      - name: Run Lint
        run: pnpm biome:ci

      #  test_ci:
      - name: Run Tests
        run: pnpm test:ci --reporter=verbose

      #  build_deploy:
      - name: Pull Vercel Environment Information
        run: pnpm dlx --allow-build=esbuild vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: pnpm dlx --allow-build=esbuild vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        run: pnpm dlx --allow-build=esbuild vercel deploy --prod --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
