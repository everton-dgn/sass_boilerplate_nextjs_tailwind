name: Secret Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  scan:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      #  config_actions:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # add pnpm
      - name: Config pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      #  setup_node:
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      #  install_dependencies:
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      #  install_scanner:
      - name: Install pinned kingfisher
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/kingfisher.tar.gz \
            https://github.com/mongodb/kingfisher/releases/download/v1.110.0/kingfisher-linux-x64.tgz
          echo "f55296fe4c6090c27963b2f62f5938e90b187ab1357466c8661d3786f6be7f14  /tmp/kingfisher.tar.gz" | sha256sum --check
          tar -xzf /tmp/kingfisher.tar.gz -C /tmp kingfisher

      - name: Scan the working tree for secrets
        run: PATH="/tmp:${PATH}" pnpm scan:secrets
